description: >-
  Linc'well, Inc. (株式会社Linc'well) is a Tokyo-based healthcare technology company founded in January
  2018 whose stated mission is to take healthcare one step further through technology. It operates a
  healthcare platform that connects medical professionals with patients across online and offline care,
  organized into three business lines: a telehealth platform licensed to medical institutions, where
  patients complete everything from booking to consultation on web, smartphone, or tablet, pay by credit
  card or pay-later, and have medication delivered or dispensed at a local pharmacy; a Smart Clinic
  clinic-DX service that digitizes core primary-care operations including appointment booking, medical
  intake, payment, and medical record entry; and a healthcare e-commerce business covering cosmetics,
  contact lenses, over-the-counter medicines, online medication guidance, and prescription dispensing.
  Linc'well runs the CLINIC FOR clinic brand and the miteme commerce and pharmacy properties, and is
  backed by DCM Ventures. It publishes no public API, developer portal, or machine-readable API
  specification; integration is a commercial arrangement with medical institutions.
